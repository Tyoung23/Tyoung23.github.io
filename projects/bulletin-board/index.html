<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it">
                <h4>You are kind, you are smart ,you are important</h4>
            </div>
            <div class="post-it">
                <p>Beleive in yourself,even when no one else does</p>
            </div>

            <div class="post-it">
                <ol>
                    <li>bannas</li>
                    <li>chicken</li>
                    <li>milk</li>
                    <li>bread</li>
                </ol>
            </div>
            <br>

            <div class="post-it">
                <img 
                    src="images/stars.jpeg"
                    alt="stars"
                >
            </div>
        
            <div class="post-it">
                <ul>
                    <li>get break</li>
                    <li>get enough rest</li>
                </ul>
            </div>
                            
            <div class="post-it">
                <img 
                    src="images/Cinnamon-Rolls.jpg"
                    alt="cinnamon-rolls"
                >
            </div>
        </div>
    </body>
</html>
