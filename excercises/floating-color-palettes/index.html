<!DOCTYPE html>
<html lang="en">

        <title>Floating Color Palettes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="color-palette">
            <h2 class="color">Color palette 1</h2>

         <div class="color-palette">
            <h2 class="color">Color palette 2</h2>
            <h4 class="color" id="Alice-blue">#D9F0FF</h4>
            <h4 class="color" id="sky-blue">#A3D5FF</h4>

        </div>
